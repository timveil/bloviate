# Run test classes concurrently, methods within a class sequentially.
#
# Safe here because the database tests are isolated by construction: every
# fillDatabase(...) call stands up its own Testcontainers instance and tears it
# down again, so no two tests share a database, a schema, or a connection pool.
# Keeping methods same_thread means a class still starts one container at a time.
#
# Container startup dominates this suite -- roughly 100s of the wall clock is
# spent booting ~39 containers -- and that time is almost entirely spent waiting
# rather than computing, so overlapping it is where the win is.
junit.jupiter.execution.parallel.enabled=true
junit.jupiter.execution.parallel.mode.default=same_thread
junit.jupiter.execution.parallel.mode.classes.default=concurrent

# Fixed rather than dynamic: the ceiling here is how many database containers can
# run at once, not how many cores are free. GitHub's ubuntu-latest runners have
# 4 vCPU / 16 GB, which comfortably holds four of these images.
junit.jupiter.execution.parallel.config.strategy=fixed
junit.jupiter.execution.parallel.config.fixed.parallelism=4
